<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>研究数字员工</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6ea; --text: #1c2430;
    --muted: #6b7686; --accent: #2456d6; --mono: "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  .badge { font: 11px var(--mono); background: #eef2fb; color: var(--accent);
           border-radius: 10px; padding: 2px 10px; }
  .badge.w { background: #f0f7ee; color: #2c7a3f; }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 16px; padding: 16px 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
           padding: 14px 16px; }
  .panel h2 { font-size: 13px; color: var(--muted); margin: 0 0 8px;
              text-transform: uppercase; letter-spacing: .05em; }
  textarea, input, button { font: inherit; }
  textarea { width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line);
             border-radius: 6px; padding: 8px; }
  .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  input[type=number] { width: 64px; border: 1px solid var(--line); border-radius: 6px; padding: 5px; }
  input[type=text] { flex: 1; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  button { border: 1px solid var(--accent); background: var(--accent); color: #fff;
           border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .task { padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex;
          justify-content: space-between; gap: 8px; align-items: center; }
  .task:hover { background: #f0f3f8; }
  .task.sel { background: #e8eefb; }
  .task .id { font: 12px var(--mono); }
  .task .prog { font: 11px var(--mono); color: var(--muted); }
  .st { font: 11px var(--mono); border-radius: 9px; padding: 1px 8px; white-space: nowrap; }
  .st.running { background: #e3ecff; color: #2456d6; animation: pulse 1.2s infinite; }
  .st.done { background: #e0f2e4; color: #2c7a3f; }
  .st.paused, .st.interrupted { background: #fff3e0; color: #b26a00; }
  .st.failed { background: #fde8e8; color: #c0392b; }
  .st.unknown { background: #eee; color: #666; }
  @keyframes pulse { 50% { opacity: .5; } }
  .tabs { display: flex; gap: 4px; margin: 10px 0; }
  .tab { padding: 5px 14px; border-radius: 6px; cursor: pointer; color: var(--muted); }
  .tab.on { background: #e8eefb; color: var(--accent); font-weight: 600; }
  #detail-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #detail-head .id { font: 14px var(--mono); font-weight: 600; }
  #events { font: 12px var(--mono); max-height: 480px; overflow: auto; }
  .ev { padding: 3px 6px; border-left: 3px solid transparent; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis; }
  .ev:hover { white-space: normal; }
  .ev .n { color: var(--muted); display: inline-block; width: 44px; }
  .ev.llm.called { border-color: #2456d6; }
  .ev.tool.called { border-color: #2c7a3f; }
  .ev.tool.called.err { border-color: #c0392b; }
  .ev.task.completed, .ev.plan.created, .ev.report.generated { border-color: #b26a00; background: #fffaf0; }
  .ev.task.paused, .ev.task.failed, .ev.task.resumed, .ev.checkpoint.saved { border-color: #999; }
  #report { max-height: 560px; overflow: auto; padding: 4px 8px; }
  #report h1 { font-size: 20px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  #report h2 { font-size: 17px; margin-top: 18px; }
  #report h3 { font-size: 15px; }
  #report code { background: #f0f2f5; border-radius: 3px; padding: 1px 4px; font: 12px var(--mono); }
  #report a { color: var(--accent); }
  #report ul { padding-left: 22px; }
  #report blockquote { border-left: 3px solid var(--line); margin: 8px 0; padding: 2px 12px; color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .msec { font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  .model-row, .web-row { display: flex; align-items: center; gap: 6px;
    padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
    margin-top: 6px; font-size: 13px; }
  .model-row .pos { font: 11px var(--mono); color: var(--muted); width: 20px; }
  .model-row .nm, .web-row .nm { font-weight: 600; font: 12px var(--mono); }
  .model-row .md { font: 11px var(--mono); color: var(--muted); flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .model-row .ok, .web-row .ok { color: #2c7a3f; font-size: 11px; }
  .model-row .err { color: #c0392b; font-size: 11px; }
  .model-row button.mini, .model-edit button.mini, .web-row button.mini {
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    padding: 2px 7px; font-size: 12px; }
  .model-edit { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px;
    padding: 6px 8px; border: 1px dashed var(--accent); border-radius: 6px; }
  .model-edit input, .web-row input { border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 6px; font: 12px var(--mono); }
  .model-edit input, .web-row input { flex: 1; min-width: 120px; }
  .web-row .cur { font-size: 11px; color: var(--accent); }
  .madd { margin-top: 8px; }
  .madd input { border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 6px; font: 12px var(--mono); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>研究数字员工</h1>
  <span class="badge" id="b-llm">LLM: …</span>
  <span class="badge w" id="b-web">Web: …</span>
</header>
<main>
  <div>
    <div class="panel">
      <h2>新建研究任务</h2>
      <textarea id="prompt" placeholder="例：调研主流 Coding Agent 的任务规划 / 工具使用 / 上下文管理差异"></textarea>
      <div class="row">
        <input type="number" id="limit" value="3" min="1" max="10" title="子任务上限">
        <input type="text" id="tid" placeholder="task-id（可留空自动生成）">
        <button id="btn-run">开始</button>
      </div>
      <div class="hint">子任务上限控制任务时长与成本；默认 3。</div>
    </div>
    <div class="panel" style="margin-top:14px">
      <h2>任务</h2>
      <div id="task-list"><div class="empty">暂无任务</div></div>
    </div>
    <div class="panel" style="margin-top:14px">
      <h2>模型配置</h2>
      <div id="model-status" class="hint" style="margin-top:0">加载中…</div>
      <h3 class="msec">LLM 降级链（首位为主模型）</h3>
      <div id="llm-chain"></div>
      <div class="madd">
        <div class="row">
          <input type="text" id="llm-new-name" placeholder="name" style="flex:0 0 84px">
          <input type="text" id="llm-new-model" placeholder="模型名，如 glm-5.3" style="flex:1">
        </div>
        <div class="row">
          <input type="text" id="llm-new-base" placeholder="base_url（留空 = OpenAI 兼容默认）" style="flex:1">
          <input type="password" id="llm-new-key" placeholder="API Key" style="flex:1">
        </div>
        <div class="row"><button id="btn-llm-add" class="ghost">添加模型</button></div>
      </div>
      <h3 class="msec">Web 搜索</h3>
      <div id="web-backends"></div>
      <div class="hint">变更对新任务/恢复任务生效，运行中任务沿用原配置；
        持久化于 storage/models.json（key 明文，勿提交仓库）。</div>
    </div>
  </div>
  <div class="panel">
    <div id="detail-head">
      <span class="empty" id="ph">← 选择一个任务查看详情</span>
      <span id="detail-meta"></span>
    </div>
    <div class="tabs" id="tabs" style="display:none">
      <div class="tab on" data-tab="timeline">事件时间线</div>
      <div class="tab" data-tab="report">研究报告</div>
      <span style="flex:1"></span>
      <button class="ghost" id="btn-resume" style="display:none">恢复运行</button>
      <span class="hint" id="resume-hint" style="display:none"></span>
    </div>
    <div id="view-timeline"><div id="events"></div></div>
    <div id="view-report" style="display:none"><div id="report"></div></div>
  </div>
</main>
<script>
"use strict";
console.log("[digital-worker] frontend v4（模型配置面板；若控制台显示 v3 或更早，请 Ctrl+F5 强制刷新）");
const $ = (s) => document.querySelector(s);
let current = null;          // 当前选中任务 id
let since = 0;              // 事件增量拉取游标
let pollTimer = null;
let pollGen = 0;           // 轮询代数：切换任务/恢复时自增，用于丢弃过期响应
const lastStatus = {};     // 上次观察到的任务状态（仅“运行中→完成”过渡时自动切报告页）

// ---- 迷你 Markdown 渲染（仅报告需要的基础子集）----
function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function md(src) {
  const inline = (s) => esc(s)
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
  const out = []; let inList = false, inQuote = false;
  const closeList = () => { if (inList) { out.push("</ul>"); inList = false; } };
  const closeQuote = () => { if (inQuote) { out.push("</blockquote>"); inQuote = false; } };
  for (const raw of src.split(/\r?\n/)) {
    const line = raw.trimEnd();
    if (!line.trim()) { closeList(); closeQuote(); continue; }
    let m;
    if (m = line.match(/^(#{1,4})\s+(.*)/)) { closeList(); closeQuote();
      out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); continue; }
    if (m = line.match(/^[-*]\s+(.*)/)) { closeQuote(); if (!inList) { out.push("<ul>"); inList = true; }
      out.push(`<li>${inline(m[1])}</li>`); continue; }
    if (m = line.match(/^>\s?(.*)/)) { closeList(); if (!inQuote) { out.push("<blockquote>"); inQuote = true; }
      out.push(inline(m[1])); continue; }
    closeList(); closeQuote();
    out.push(`<p>${inline(line)}</p>`);
  }
  closeList(); closeQuote();
  return out.join("\n");
}

// ---- API ----
async function api(path, opt) {
  const r = await fetch(path, opt);
  const ct = r.headers.get("content-type") || "";
  return { ok: r.ok, code: r.status, body: ct.includes("json") ? await r.json() : await r.text() };
}

async function loadStatus() {
  const r = await api("/api/status");
  if (r.ok) {
    $("#b-llm").textContent = "LLM: " + r.body.llm;
    $("#b-web").textContent = "Web: " + r.body.web;
  }
}

// ---- 模型配置（LLM 降级链增删改/重排 + Web 搜索 key） ----
async function loadModels() {
  const r = await api("/api/models");
  if (!r.ok) { $("#model-status").textContent = "模型配置加载失败：" + (r.body.error || r.code); return; }
  $("#model-status").textContent = "";
  renderLlmChain(r.body.llm);
  renderWebBackends(r.body.web);
}

function renderLlmChain(llm) {
  const box = $("#llm-chain");
  box.innerHTML = "";
  if (!llm.chain.length)
    box.innerHTML = '<div class="hint">未配置模型（当前 mock，真实任务会失败；下方可添加）</div>';
  for (const p of llm.chain) {
    const row = document.createElement("div");
    row.className = "model-row";
    const i = p.position, n = llm.chain.length;
    row.innerHTML = `<span class="pos">#${i+1}</span><span class="nm">${esc(p.name)}</span>` +
      `<span class="md" title="${esc(p.base_url||"")}">${esc(p.model)}</span>` +
      (p.has_key ? '<span class="ok">key✓</span>' : '<span class="err">无key</span>') +
      (llm.locked ? "" : `
      <button class="mini" data-act="up" ${i===0?"disabled":""} title="上移（更靠近主模型）">↑</button>
      <button class="mini" data-act="down" ${i===n-1?"disabled":""}>↓</button>
      <button class="mini" data-act="edit">改</button>
      <button class="mini" data-act="del">✕</button>`);
    if (!llm.locked) {
      row.onclick = (e) => {
        const act = e.target.dataset ? e.target.dataset.act : null;
        if (!act) return;
        e.stopPropagation();
        if (act === "up" || act === "down") {
          const order = llm.chain.map(x => x.name);
          const j = order.indexOf(p.name), k = act === "up" ? j - 1 : j + 1;
          if (k < 0 || k >= order.length) return;
          [order[j], order[k]] = [order[k], order[j]];
          orderModels(order);
        } else if (act === "edit") {
          editModel(p);
        } else if (act === "del") {
          if (confirm(`删除模型 ${p.name}？（将不再参与降级链）`)) deleteModel(p.name);
        }
      };
    }
    box.appendChild(row);
  }
  if (llm.locked) {
    const d = document.createElement("div");
    d.className = "hint"; d.textContent = "只读（当前模式 llm 已注入）";
    box.appendChild(d);
  }
}

function editModel(p) {
  const box = $("#llm-chain");
  const div = document.createElement("div");
  div.className = "model-edit";
  div.innerHTML = `
    <input id="me-model" value="${esc(p.model)}" placeholder="模型名">
    <input id="me-base" value="${esc(p.base_url||"")}" placeholder="base_url">
    <input id="me-key" type="password" placeholder="${p.has_key ? "••••（留空保持原 key）" : "API Key"}">
    <button class="mini" id="me-save">保存</button>
    <button class="mini" id="me-cancel">取消</button>`;
  box.appendChild(div);
  $("#me-cancel").onclick = () => { div.remove(); };
  $("#me-save").onclick = async () => {
    const body = { model: $("#me-model").value };
    if ($("#me-base").value !== (p.base_url || "")) body.base_url = $("#me-base").value;
    if ($("#me-key").value) body.key = $("#me-key").value;  // 留空 = 保持原 key
    const r = await api(`/api/models/llm/${encodeURIComponent(p.name)}`,
      { method: "PUT", headers: {"Content-Type":"application/json"},
        body: JSON.stringify(body) });
    if (r.ok) { div.remove(); loadModels(); loadStatus(); }
    else alert("保存失败：" + (r.body.error || r.code));
  };
}

async function orderModels(order) {
  const r = await api("/api/models/llm/order",
    { method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ order }) });
  if (r.ok) { loadModels(); loadStatus(); }
  else alert("重排失败：" + (r.body.error || r.code));
}

async function deleteModel(name) {
  const r = await api(`/api/models/llm/${encodeURIComponent(name)}`, { method: "DELETE" });
  if (r.ok) { loadModels(); loadStatus(); }
  else alert("删除失败：" + (r.body.error || r.code));
}

$("#btn-llm-add").onclick = async () => {
  const body = { name: $("#llm-new-name").value.trim(),
                 model: $("#llm-new-model").value.trim(),
                 base_url: $("#llm-new-base").value.trim(),
                 key: $("#llm-new-key").value.trim() };
  if (!body.name || !body.model) { alert("请填写 name 与模型名"); return; }
  const r = await api("/api/models/llm",
    { method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify(body) });
  if (r.ok) {
    $("#llm-new-name").value = ""; $("#llm-new-model").value = "";
    $("#llm-new-base").value = ""; $("#llm-new-key").value = "";
    loadModels(); loadStatus();
  } else alert("添加失败：" + (r.body.error || r.code));
};

function renderWebBackends(web) {
  const box = $("#web-backends");
  box.innerHTML = `<div class="hint" style="margin-top:0">当前后端：<b>${esc(web.active || "-")}</b>${web.locked ? "（只读）" : ""}</div>`;
  for (const b of (web.backends || [])) {
    const row = document.createElement("div");
    row.className = "web-row";
    if (b.kind === "http") {
      row.innerHTML = `<span class="nm" style="flex:0 0 84px">${b.name}</span>` +
        (b.active ? '<span class="cur">当前</span>' : "") +
        `<input id="wk-${b.name}" type="password"
          placeholder="${b.has_key ? "••••（留空保持；输入新值替换）" : "API Key"}">` +
        (web.locked ? "" : `<button class="mini" id="ws-${b.name}">保存</button>`);
      if (!web.locked) $("#ws-" + b.name).onclick = async () => {
        const v = $("#wk-" + b.name).value;
        if (!v && b.has_key && !confirm(`清除 ${b.name} 的 key？（该后端将不再使用）`)) return;
        const r = await api("/api/models/web",
          { method: "POST", headers: {"Content-Type":"application/json"},
            body: JSON.stringify({ backend: b.name, key: v }) });
        if (r.ok) { loadModels(); loadStatus(); }
        else alert("保存失败：" + (r.body.error || r.code));
      };
    } else if (b.name === "you-mcp") {
      row.innerHTML = `<span class="nm" style="flex:0 0 84px">you-mcp</span>
        <span class="md">${b.active ? "当前（免费 MCP，无需 key，IP 限流）"
          : (b.available ? "可用（无 key 时自动启用）" : "不可用（you-mcp 关闭或有 key 后端优先）")}</span>`;
    } else {
      row.innerHTML = `<span class="nm" style="flex:0 0 84px">mock</span>
        <span class="md">${b.active ? "当前（离线演示模式）" : "无 key 且 you-mcp 关闭时的兜底"}</span>`;
    }
    box.appendChild(row);
  }
}

async function refreshTasks() {
  const r = await api("/api/tasks");
  if (!r.ok) return;
  const box = $("#task-list");
  if (!r.body.tasks.length) { box.innerHTML = '<div class="empty">暂无任务</div>'; return; }
  box.innerHTML = "";
  for (const t of r.body.tasks) {
    const d = document.createElement("div");
    d.className = "task" + (t.task_id === current ? " sel" : "");
    const prog = t.subtasks_total != null ? ` ${t.subtasks_done}/${t.subtasks_total}` : "";
    d.innerHTML = `<span class="id">${t.task_id}</span><span class="prog">${t.status}${prog}</span><span class="st ${t.status}">${t.status}</span>`;
    d.onclick = () => selectTask(t.task_id);
    box.appendChild(d);
  }
  if (current) updateDetailHead(current);
}

function updateDetailHead(tid) {
  api("/api/tasks").then((r) => {
    if (tid !== current) return;  // 响应期间已切换任务 → 丢弃
    const t = r.body.tasks.find(x => x.task_id === tid);
    if (!t) return;
    $("#ph").style.display = "none";
    $("#tabs").style.display = "flex";
    // 只替换 #detail-meta 子容器；不能对 #detail-head 整体 innerHTML
    // （#ph 嵌套在其中，会被销毁，导致下次 selectTask 取到 null 抛错）
    $("#detail-meta").innerHTML = `<span class="id">${t.task_id}</span>
      <span class="st ${t.status}">${t.status}</span>
      ${t.subtasks_total != null ? `<span class="prog" style="font:12px var(--mono);color:var(--muted)">子任务 ${t.subtasks_done}/${t.subtasks_total}</span>` : ""}`;
    // 恢复按钮：失败/中断/暂停任务均可恢复——
    // 有检查点 → “恢复运行”（断点续跑）；无检查点 → “重新运行”（整体重跑）
    const btn = $("#btn-resume");
    btn.style.display = t.resumable ? "" : "none";
    const hint = $("#resume-hint");
    if (t.resumable) {
      if (t.has_checkpoint) {
        btn.textContent = "恢复运行";
        hint.textContent = "将从最近检查点继续，已完成子任务不重做";
      } else {
        btn.textContent = "重新运行";
        hint.textContent = "任务无检查点（可能在计划阶段崩溃），将重新生成计划从头执行";
      }
      hint.style.display = "";
    } else {
      hint.style.display = "none";
    }
    // 仅在“运行中 → 完成”的过渡时自动切报告页；
    // 选中一个已完成任务时停留在时间线页，不再被强制切走
    const prev = lastStatus[tid];
    lastStatus[tid] = t.status;
    if (prev === "running" && t.status === "done" && t.has_report
        && $("#tabs .tab.on").dataset.tab !== "report") switchTab("report");
  });
}

function selectTask(tid) {
  current = tid; since = 0; pollGen++;  // 代数+1：旧任务的在途轮询响应全部失效
  delete lastStatus[tid];
  $("#events").innerHTML = "";
  $("#report").innerHTML = "";
  $("#ph").style.display = "none"; $("#tabs").style.display = "flex";
  switchTab("timeline");
  refreshTasks();
  pollEvents();
}

function switchTab(name) {
  for (const t of $("#tabs").querySelectorAll(".tab"))
    t.classList.toggle("on", t.dataset.tab === name);
  $("#view-timeline").style.display = name === "timeline" ? "" : "none";
  $("#view-report").style.display = name === "report" ? "" : "none";
  if (name === "report" && current) loadReport();
}

function evText(seq, type, p) {
  let extra = "";
  if (type === "llm.called")
    extra = ` ${p.provider||""} ${p.tokens_in||0}+${p.tokens_out||0}tok ${p.latency_ms||0}ms${p.retries?` retry=${p.retries}`:""}`;
  else if (type === "tool.called") {
    extra = ` ${p.tool||""} ${p.ok ? "ok" : "ERR"}`;
    if (p.error) extra += ` ${p.error.slice(0,80)}`;
  } else if (p && Object.keys(p).length)
    extra = " " + JSON.stringify(p).slice(0, 140);
  return extra;
}

async function pollEvents() {
  if (!current) return;
  const task = current, gen = pollGen;  // 快照：请求发出时的任务与代数
  const r = await api(`/api/tasks/${encodeURIComponent(task)}/timeline?since=${since}`);
  if (gen !== pollGen || current !== task) return;  // 已切换任务 → 丢弃过期响应，不污染 since
  if (r.ok) {
    for (const [seq, type, p] of r.body.events) {
      since = Math.max(since, seq);
      const d = document.createElement("div");
      const isErr = type === "tool.called" && p && !p.ok;
      d.className = "ev " + type + (isErr ? " err" : "");
      d.innerHTML = `<span class="n">#${seq}</span>${type}${esc(evText(seq, type, p))}`;
      $("#events").appendChild(d);
    }
    $("#events").scrollTop = $("#events").scrollHeight;
    const status = r.body.status;
    updateDetailHead(current);
    if (status === "running") {
      // 报告标签页开着且任务未完成时，刷新占位状态
      if (current && $("#tabs .tab.on").dataset.tab === "report") loadReport();
      pollTimer = setTimeout(pollEvents, 1500);
    }
    return; // 终态 → 停止轮询
  }
  pollTimer = setTimeout(pollEvents, 3000);
}

async function loadReport() {
  if (!current) return;
  const r = await api(`/api/tasks/${encodeURIComponent(current)}/report`);
  $("#report").innerHTML = r.ok ? md(r.body) : '<div class="empty">报告尚未生成</div>';
}

// ---- 事件绑定 ----
$("#tabs").addEventListener("click", (e) => {
  if (e.target.dataset.tab) switchTab(e.target.dataset.tab);
});
$("#btn-resume").onclick = async () => {
  if (!current) return;
  const btn = $("#btn-resume");
  btn.disabled = true;  // 防连点：恢复请求在途期间锁住按钮
  try {
    const r = await api(`/api/tasks/${encodeURIComponent(current)}/resume`,
                        { method: "POST", headers: {"Content-Type":"application/json"}, body: "{}" });
    if (r.ok) { pollGen++; since = 0; $("#events").innerHTML = ""; switchTab("timeline"); pollEvents(); }
    else alert("恢复失败：" + (r.body.error || r.code));
  } finally { btn.disabled = false; }
};
$("#btn-run").onclick = async () => {
  const prompt = $("#prompt").value.trim();
  if (!prompt) { alert("请填写研究主题"); return; }
  const body = { prompt, limit_subtasks: +$("#limit").value || 3 };
  const tid = $("#tid").value.trim();
  if (tid) body.task_id = tid;
  const r = await api("/api/tasks", { method: "POST", headers: {"Content-Type":"application/json"},
                                      body: JSON.stringify(body) });
  if (r.ok) {
    const id = r.body.task_id;
    $("#prompt").value = ""; $("#tid").value = "";
    selectTask(id);
  } else alert("提交失败：" + (r.body.error || r.code));
};

loadStatus();
refreshTasks();
loadModels();
setInterval(refreshTasks, 4000);
</script>
</body>
